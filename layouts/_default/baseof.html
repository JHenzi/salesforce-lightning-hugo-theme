<!DOCTYPE html>
<html lang="{{ site.Language }}" dir="{{ .Language.LanguageDirection | default "ltr" }}">
<head>
    {{- partial "head.html" . }}
</head>
<body>
    {{- partialCached "header.html" . .Page -}}
    <main class="slds-main">
        {{- block "main" . }}{{ end }}
    </main>
    {{- partialCached "footer.html" . .Layout .Kind (.Param "hideFooter") -}}
    {{- partial "scripts.html" . }}
</body>
</html>
