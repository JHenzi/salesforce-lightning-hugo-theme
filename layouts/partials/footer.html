{{- if ne (.Param "hideFooter") true }}
<footer class="slds-grid slds-wrap slds-gutters slds-p-around_large" role="contentinfo">
    <div class="slds-col slds-size_1-of-1">
        <div class="slds-text-align_center">
            <p class="slds-text-body_small">
                &copy; {{ now.Year }} {{ site.Title }}. 
                {{- if site.Params.author }} All rights reserved.{{ end }}
            </p>
            {{- if site.Params.socialIcons }}
            <div class="slds-m-top_small">
                {{- range site.Params.socialIcons }}
                <a href="{{ .url }}" class="slds-button slds-button_neutral slds-m-horizontal_xx-small" aria-label="{{ .name }}" target="_blank" rel="noopener">
                    {{ .name | title }}
                </a>
                {{- end }}
            </div>
            {{- end }}
        </div>
    </div>
</footer>
{{- end }}
